# Applies change files that the daily routine commits under changes/ to both
# Supabase and Airtable. Only files added in the push are applied, so earlier
# batches never overwrite later manual edits.
name: Apply changes

on:
  push:
    paths: ['changes/*.json']
  workflow_dispatch:
    inputs:
      file:
        description: Change file to apply (path in the repo)
        required: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Find new change files
        id: files
        run: |
          if [ -n "${{ inputs.file }}" ]; then
            files="${{ inputs.file }}"
          else
            before="${{ github.event.before }}"
            if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
              before=$(git merge-base origin/main HEAD)
            fi
            files=$(git diff --name-only --diff-filter=A "$before" "${{ github.sha }}" -- 'changes/*.json')
          fi
          echo "files<<EOF" >> "$GITHUB_OUTPUT"; echo "$files" >> "$GITHUB_OUTPUT"; echo "EOF" >> "$GITHUB_OUTPUT"
      - name: Apply
        env:
          SUPABASE_POOLER_URL: ${{ secrets.SUPABASE_POOLER_URL }}
          SUPABASE_DB_PASS: ${{ secrets.SUPABASE_DB_PASS }}
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: apppVEn1Dkc0dBXfk
        run: |
          for f in ${{ steps.files.outputs.files }}; do
            echo "::group::$f"
            node scripts/apply-changes.mjs "$f"
            echo "::endgroup::"
          done
